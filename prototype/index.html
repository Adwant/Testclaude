<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E9EBF1">
<title>Спортика · выбор концепции</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10151C;--muted:#6C7280;--bg:#E9EBF1;--card:#fff;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(900px 500px at 12% -10%,#DCE6FF 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#F2EBFF 0,transparent 55%),radial-gradient(700px 500px at 60% 110%,#E4F6EA 0,transparent 60%),var(--bg);min-height:100vh}
main{max-width:1080px;margin:0 auto;padding:56px 24px 64px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.7);padding:7px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.9)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#16A34A;box-shadow:0 0 0 4px rgba(22,163,74,.16);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(22,163,74,.05)}}
h1{font-size:clamp(34px,6vw,56px);line-height:1.02;letter-spacing:-.025em;font-weight:600;margin:18px 0 12px}
.lead{font-size:clamp(15px,2vw,18px);line-height:1.5;color:var(--muted);max-width:620px;margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,380px));gap:20px}
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border-radius:32px;padding:20px 20px 22px;border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(16,21,28,.04),0 24px 48px -28px rgba(16,21,28,.28);overflow:hidden;opacity:0;transform:translateY(18px);animation:in .7s var(--ease) forwards;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes in{to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px);box-shadow:0 1px 0 rgba(16,21,28,.04),0 36px 60px -26px rgba(16,21,28,.36)}
.card:active{transform:translateY(-2px) scale(.995)}
.stage{position:relative;height:300px;border-radius:24px;margin-bottom:18px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;background:linear-gradient(160deg,var(--a),var(--b))}
.phone{width:196px;border-radius:30px 30px 0 0;overflow:hidden;box-shadow:0 0 0 6px #10151C,0 24px 40px -10px rgba(16,21,28,.4);transform:translateY(34px) rotate(-2deg);transition:transform .6s var(--ease)}
.phone img{display:block;width:100%}
.phone.p2{position:absolute;width:150px;left:calc(50% + 60px);transform:translateY(80px) rotate(5deg);opacity:.96}
.phone.p3{position:absolute;width:150px;right:calc(50% + 60px);transform:translateY(90px) rotate(-6deg);opacity:.96}
.card:hover .phone:not(.p2):not(.p3){transform:translateY(14px) rotate(0)}
.card:hover .p2{transform:translateY(54px) rotate(8deg)}.card:hover .p3{transform:translateY(64px) rotate(-9deg)}
.tag{display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.02em;padding:5px 10px;border-radius:10px;background:var(--tg);color:var(--tc);margin-bottom:10px;align-self:flex-start}
.card h2{font-size:24px;letter-spacing:-.015em;margin:0 0 6px;font-weight:600}
.card p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 18px}
.go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 6px 0 18px;border-radius:18px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;box-shadow:0 10px 20px -8px rgba(16,21,28,.5)}
.go b{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.14);transition:transform .35s var(--ease)}
.card:hover .go b{transform:translateX(3px)}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:34px;font-size:13px;color:var(--muted)}
.meta span{display:flex;align-items:center;gap:6px}
.meta span:before{content:"";width:5px;height:5px;border-radius:50%;background:#A3A9B5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
