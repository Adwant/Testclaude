<style>
:root{--ink:#10151C;--muted:#6C7280;--acc:#F94113;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9EBF1;font-family:Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;overscroll-behavior:none}
#app{display:flex;height:100%}

.themes{display:grid;gap:8px}
.th{display:flex;align-items:center;gap:12px;border:0;background:#fff;color:var(--ink);font:600 14px/1.2 Onest,system-ui,sans-serif;padding:10px 12px;border-radius:16px;cursor:pointer;text-align:left;box-shadow:0 1px 0 rgba(16,21,28,.06),0 4px 12px -6px rgba(16,21,28,.18);transition:transform .15s var(--ease),box-shadow .15s}
.th:hover{transform:translateY(-1px)}.th:active{transform:scale(.98)}
.th small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.th .sw{display:flex;gap:3px;flex:none}.th .sw i{width:7px;height:26px;border-radius:4px}
.th.on{box-shadow:0 0 0 2px var(--ink),0 6px 16px -8px rgba(16,21,28,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip:hover{transform:translateY(-1px)}.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:#fff}
.chip.main{background:var(--ink);color:#fff}
details{margin-top:8px;border-radius:14px;background:rgba(255,255,255,.55)}

details summary::-webkit-details-marker{display:none}
details summary span{color:var(--muted);font-weight:500}
details .chips{padding:0 10px 10px}
details .chip{font-size:12px;padding:7px 10px;border-radius:10px}
.kbd{font-size:12px;color:var(--muted);line-height:1.7}.kbd b{color:var(--ink);font-weight:600}
.tog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--ink)}
#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
#wrap{position:relative;flex:none}
#phone{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0;border-radius:52px;overflow:hidden;background:#EDEEF2;box-shadow:0 0 0 9px #10151C,0 0 0 10px #2A313C,0 44px 90px -24px rgba(16,21,28,.5);isolation:isolate}
body.bare #phone{border-radius:0;box-shadow:none}
.scr{position:absolute;inset:0;overflow:hidden;background:#EDEEF2}
.sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sc::-webkit-scrollbar{display:none}
.ct{position:relative;width:393px}
.ct img{display:block;width:393px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.strip{position:absolute;left:0;width:393px;background-repeat:no-repeat;pointer-events:none;z-index:3}
.strip .hs{pointer-events:auto}
.top{top:0;height:54px}
.bot{bottom:0}
.hs{position:absolute;cursor:pointer;border-radius:14px;touch-action:manipulation}
.hint .hs,.flash .hs{outline:1.5px dashed rgba(249,65,19,.9);outline-offset:-1px;background:rgba(249,65,19,.10)}
.flash .hs{animation:blink .8s ease-out}
@keyframes blink{0%{background:rgba(249,65,19,.3)}100%{background:rgba(249,65,19,.10)}}
.shade{position:absolute;inset:0;background:rgba(16,21,28,.16);pointer-events:none;z-index:20}
.lift{box-shadow:-14px 0 34px rgba(16,21,28,.14)}
.layer{position:absolute;left:0;width:393px;background-repeat:no-repeat;z-index:30;pointer-events:none}
.ldr{position:absolute;left:0;top:0;height:3px;width:0;background:var(--acc);z-index:60;pointer-events:none}
#menu{display:none;position:fixed;left:50%;top:5px;transform:translateX(-50%);z-index:100;width:44px;height:24px;border-radius:12px;border:0;background:rgba(16,21,28,.82);color:#fff;box-shadow:0 6px 18px -6px rgba(16,21,28,.5);font-size:13px;line-height:1;cursor:pointer}
@media (max-width:980px){
 #panel{position:fixed;left:0;top:0;bottom:0;z-index:99;transform:translateX(-102%);transition:transform .4s var(--ease);background:rgba(255,255,255,.96);box-shadow:0 0 60px rgba(16,21,28,.25)}
 body.menu #panel{transform:none}
 #menu{display:block}
}

async function back(){if(busy)return;if(stack.length<2){bump();return;}busy=true;clearTimeout(cur.timer);const top=stack[stack.length-1],prev=stack[stack.length-2];const p=mkScreen(prev.i),old=cur;
 if(top.mode==='sheet'){await sheetOut(old,p);p.sc.scrollTop=prev.scroll||0;}
 else if(top.mode==='fade'){put(p,1);p.sc.scrollTop=prev.scroll||0;old.el.style.zIndex=2;const d=DUR(220);old.el.animate([{opacity:1},{opacity:0}],{duration:d,easing:'ease-in',fill:'both'});await sleep(d);old.el.remove();}
 else{put(p,1);p.sc.scrollTop=prev.scroll||0;old.el.style.zIndex=2;old.el.classList.add('lift');const sh=el('div','shade',p.el),d=DUR(400),o={duration:d,easing:EASE,fill:'both'};
  old.el.animate([{transform:'translateX(0)'},{transform:'translateX(100%)'}],o);p.el.animate([{transform:'translateX(-24%)'},{transform:'translateX(0)'}],o);sh.animate([{opacity:1},{opacity:0}],o);
  await sleep(d);old.el.remove();sh.remove();p.el.getAnimations().forEach(x=>x.cancel());}
 stack.pop();cur=p;busy=false;onShow(p);}
async function swap(i,reset){if(busy||i==null)return;busy=true;leave();const old=cur,n=mkScreen(i);await fadeIn(old,n);
 if(reset)stack=[{i,mode:'fade'}];else stack[stack.length-1]={i,mode:stack[stack.length-1].mode};cur=n;busy=false;onShow(n);}
function bump(){cur.el.animate([{transform:'translateX(0)'},{transform:'translateX(10px)'},{transform:'translateX(-6px)'},{transform:'translateX(0)'}],{duration:DUR(300),easing:'ease-out'});}
/* ---------- стиль ---------- */
async function setTheme(n,quiet){const nt=THEMES[n];if(!nt||nt===T)return;T=nt;document.documentElement.style.setProperty('--acc',T.acc);preload();
 if(cur){const old=cur,keep=old.sc.scrollTop,nn=mkScreen(old.i);clearTimeout(old.timer);put(nn,2);nn.sc.scrollTop=keep;cur=nn;
  if(!quiet){nn.el.animate([{opacity:0},{opacity:1}],{duration:DUR(260),easing:'ease-out',fill:'both'});await sleep(DUR(260));nn.el.getAnimations().forEach(x=>x.cancel());}
  old.el.remove();onShow(nn);}}
let preT=null;function preload(){const k=T.k;if(preT===k)return;preT=k;let i=0;const step=()=>{if(preT!==k||i>=N)return;const im=new Image();im.src='img/'+k+'/'+D.keys[i++]+'.webp';im.onload=im.onerror=step;};step();step();step();}
/* ---------- действия из реакций Figma ---------- */
async function run(act,src,inTab){for(const p of act.split(';')){const c=p[0],v=p.length>1?+p.slice(1):null;
  if(c==='m')await setTheme(v);
  else if(c==='b')await back();
  else if(c==='g')await go(v,'push');
  else if(c==='s')await go(v,v===13?'fade':'sheet');
  else if(c==='t'){const fromTab=src!=null&&TAB(src)>0,toTab=TAB(v)>0;
   if(inTab||(toTab&&src!=null&&!fromTab)||(toTab&&fromTab&&SEC[src]!==SEC[v]))await swap(v,true);
   else if(toTab&&fromTab)await swap(v,false);
   else await go(v,'fade');}}}
phone.addEventListener('click',e=>{const h=e.target.closest('.hs');if(!h||busy)return;run(h.dataset.a,cur.i,!!h.dataset.tab);});
/* ---------- адрес #тема/экран ---------- */
function route(){try{history.replaceState(null,'','#'+T.id+'/'+D.keys[cur.i]);}catch(e){}}
function parse(){const m=(location.hash||'').slice(1).split('/');const t=THEMES.findIndex(x=>x.id===m[0]);return {t:t<0?0:t,i:KEY[m[1]]??0};}
async function onHash(){while(busy)await sleep(60);const r=parse();
 if(r.i===cur.i){await setTheme(r.t);return;}
 T=THEMES[r.t];document.documentElement.style.setProperty('--acc',T.acc);preload();await swap(r.i,true);}
addEventListener('hashchange',onHash);
/* ---------- панель ---------- */
function buildPanel(){panel.innerHTML='';
 const a=el('a','home',panel);a.href='../';a.textContent='← Все концепции';
 el('h1','',panel).textContent='Стиль 1 · бенто';
 el('p','',panel).textContent='Кликабельный прототип из Figma: 90 экранов, переходы и шторки как в макете. Стиль переключается для всех экранов сразу.';
 el('h2','',panel).textContent='Стиль';const th=el('div','themes',panel);
 THEMES.forEach((t,n)=>{const b=el('button','th',th);b.dataset.t=n;const sw=el('span','sw',b);t.sw.forEach(c=>{el('i','',sw).style.background=c;});const tx=el('span','',b);tx.innerHTML=t.name+'<small>'+t.sub+'</small>';b.onclick=()=>{setTheme(n);closeMenu();};});
 el('h2','',panel).textContent='Быстрый старт';const q=el('div','chips',panel);
 QUICK.forEach(([t,i])=>{const b=el('button','chip main',q);b.textContent=t;b.onclick=()=>{swap(i,true);closeMenu();};});
 el('h2','',panel).textContent='Все экраны';
 D.groups.forEach((g,gi)=>{const d=el('details','',panel);d.dataset.g=gi;const s=el('summary','',d);s.innerHTML=g[0]+' <span>'+g[1].length+'</span>';const c=el('div','chips',d);
  g[1].forEach(i=>{const b=el('button','chip',c);b.dataset.i=i;b.textContent=D.names[i];b.onclick=()=>{swap(i,true);closeMenu();};});});
 el('h2','',panel).textContent='Управление';
 const k=el('div','kbd',panel);k.innerHTML='<b>H</b> — подсветить зоны нажатия<br><b>Esc</b> / <b>←</b> — назад<br><b>1 2 3</b> — Спортика / ВКонтакте / Альфа<br>Тап по статус-бару — экран смены стиля';
 const tg=el('label','tog',panel);tg.innerHTML='<input type="checkbox"> Показывать зоны нажатия';tg.querySelector('input').onchange=e=>setHint(e.target.checked);}
function updatePanel(){panel.querySelectorAll('.th').forEach(b=>b.classList.toggle('on',THEMES[+b.dataset.t]===T));
 panel.querySelectorAll('details .chip').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur.i));
 const g=SEC[cur.i];panel.querySelectorAll('details').forEach(d=>{if(+d.dataset.g===g&&!d.open)d.open=true;});}
function setHint(v){hint=v;phone.classList.toggle('hint',v);const c=panel.querySelector('.tog input');if(c)c.checked=v;}
function closeMenu(){document.body.classList.remove('menu');}
document.getElementById('menu').onclick=()=>document.body.classList.toggle('menu');
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(e.key==='Escape'||e.key==='ArrowLeft')back();else if(e.key==='h'||e.key==='H'||e.key==='р'||e.key==='Р')setHint(!hint);else if('123'.includes(e.key))setTheme(+e.key-1);});
phone.addEventListener('pointerdown',e=>{if(!hint&&!e.target.closest('.hs')){phone.classList.remove('flash');void phone.offsetWidth;phone.classList.add('flash');setTimeout(()=>phone.classList.remove('flash'),800);}});
/* ---------- старт ---------- */
(function(){const r=parse();T=THEMES[r.t];document.documentElement.style.setProperty('--acc',T.acc);buildPanel();fit();cur=mkScreen(r.i);put(cur,1);stack=[{i:r.i,mode:'fade'}];onShow(cur);setTimeout(preload,600);})();
</script>
</body>
